- name: install jenkins baremetal
  hosts: Jenkins
  become: yes
  tasks:
    - name: install gpg key for kubernetes
      ansible.builtin.get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        mode: "0644"
    - name: adding file
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        filename: Jenkins
        state: present
        update_cache: yes
    - name: install jenkins
      ansible.builtin.apt:
        name: jenkins
        state: present
        update_cache: yes
    - name: Enable and start Jenkins
      ansible.builtin.service:
        name: jenkins
        state: started
        enabled: true
