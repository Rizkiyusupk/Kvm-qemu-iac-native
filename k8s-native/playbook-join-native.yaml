- name: join to cluster
  hosts: masters
  become: yes

  tasks:
    - name: pre pull image k8s
      ansible.builtin.command: kubeadm config images pull
      changed_when: false
    - name: init
      ansible.builtin.command: kubeadm init --apiserver-advertise-address=ip-node-master --pod-network-cidr=10.244.0.0/16 --node-name=$node1 --apiserver-cert-extra-sans=127.0.0.1,ip-laptop1
      args:
        creates: /etc/kubernetes/admin.conf
    - name: Buat join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_command_output
      changed_when: false
    - name: join command
      set_fact:
        join_command: "{{ join_command_output.stdout }}"

- name: workers join to cluster
  hosts: workers
  become: yes
  tasks:
    - name: join cluster
      ansible.builtin.shell: "{{ hostvars[groups['masters'][0]]['join_command'] }}"
      args:
        creates: /etc/kubernetes/kubelet.conf
